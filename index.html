<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vnua-connect</title>
  <meta name="description" content="Find new student clubs at Hofstra, join or help build one, RSVP and check in at events. Student-run; not affiliated with Hofstra University.">
  <!-- Link previews in iMessage / GroupMe / Instagram -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Vnua-connect">
  <meta property="og:title" content="Vnua-connect: join or help build a new club">
  <meta property="og:description" content="Tap to see the club, then join with your Hofstra email. Student-run; not affiliated with Hofstra University.">
  <meta property="og:image" content="https://adrielvent.github.io/Vnua-Connect/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vnua-connect">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-512.png">
  <link rel="manifest" href="manifest.json">
  <script>/* apply the saved Light/Dark choice before first paint */ try { var t = localStorage.getItem('vnua-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Figtree (SIL Open Font License) for headings; body text uses the system font. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="web/app.css?v=11">
</head>
<body>
  <div id="app" aria-live="polite"><div class="boot"><div class="spinner" role="status" aria-label="Loading"></div></div></div>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px">Vnua-connect needs JavaScript turned on.</p></noscript>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="web/config.js?v=11"></script>
  <script src="web/app.js?v=11"></script>
</body>
</html>
